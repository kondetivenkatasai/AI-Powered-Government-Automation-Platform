version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: govflow_postgres
    environment:
      POSTGRES_DB: govflow_db
      POSTGRES_USER: govflow_user
      POSTGRES_PASSWORD: govflow_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govflow_backend
    environment:
      - DATABASE_URL=postgresql://govflow_user:govflow_password_2026@postgres:5432/govflow_db
      - SECRET_KEY=govflow_ai_super_secret_jwt_key_2026
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govflow_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
