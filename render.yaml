services:
  - type: web
    name: govflow-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        value: govflow_ai_super_secret_jwt_key_2026
      - key: PYTHONPATH
        value: .
